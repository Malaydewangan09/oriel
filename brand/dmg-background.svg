<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420">
  <!-- Background of the Sill disk image window. Icons sit at (170,180) and (490,180). Flat colours, no gradients. -->
  <rect width="660" height="420" fill="#0d1330"/>
  <g fill="#fff">
    <circle cx="40" cy="40" r="1.2" opacity=".6"/><circle cx="120" cy="80" r="1" opacity=".4"/><circle cx="300" cy="36" r="1.2" opacity=".5"/>
    <circle cx="380" cy="70" r="1" opacity=".35"/><circle cx="560" cy="30" r="1.3" opacity=".6"/><circle cx="620" cy="110" r="1" opacity=".4"/>
    <circle cx="30" cy="250" r="1" opacity=".35"/><circle cx="636" cy="240" r="1.1" opacity=".45"/><circle cx="250" cy="120" r="1" opacity=".3"/>
  </g>
  <circle cx="560" cy="294" r="18" fill="#fbf0cf"/>
  <path d="M0 350 C 80 322, 150 312, 230 334 S 380 356, 450 336 S 580 306, 660 340 V 420 H 0 Z" fill="#2b3873"/>
  <path d="M0 376 C 100 360, 190 366, 290 374 S 470 388, 560 368 S 640 362, 660 368 V 420 H 0 Z" fill="#19224d"/>
  <rect y="392" width="660" height="28" fill="#0b1029"/>
  <g fill="#fbf0cf"><rect x="540" y="398" width="26" height="2" rx="1" opacity=".6"/><rect x="570" y="398" width="10" height="2" rx="1" opacity=".5"/><rect x="548" y="405" width="20" height="2" rx="1" opacity=".4"/></g>
  <!-- the arrow, drawn twice slightly apart like a pen going over it -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 186 C 300 168, 352 166, 398 182" stroke-width="2.6" opacity=".85"/>
    <path d="M264 189 C 304 172, 350 171, 396 185" stroke-width="1.2" opacity=".35"/>
    <path d="M384 168 L 400 183 L 381 194" stroke-width="2.6" opacity=".85"/>
  </g>
  <text x="330" y="300" text-anchor="middle" font-family="-apple-system, Helvetica Neue, sans-serif" font-size="13" fill="#fff" fill-opacity=".6">Drag Sill into Applications</text>
  <!-- Finder draws icon labels in black, so each label sits on a moon-coloured pill. -->
  <rect x="135" y="235" width="70" height="21" rx="10.5" fill="#fbf0cf"/>
  <rect x="433" y="235" width="114" height="21" rx="10.5" fill="#fbf0cf"/>
</svg>
