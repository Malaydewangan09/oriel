name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Self-test
        run: .build/debug/Oriel --selftest
      - name: Format check
        run: swift format lint --strict --recursive --configuration .swift-format Sources
